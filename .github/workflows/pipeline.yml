name: CI/CD Pipeline

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.11"

permissions:                      
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build package
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production       
    permissions:                  
      contents: write
      actions: read
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: build

      - name: Show package
        run: ls -l build/

      - name: Check credentials  
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Token length: ${#DEPLOY_TOKEN}"
          echo "Deploy target: ${{ vars.DEPLOY_TARGET }}"