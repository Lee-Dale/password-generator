name: Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt
      - name: Tests ausführen
        run: python -m pytest -v
      

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c build/app.zip src/
      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-paket
          path: build/

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment starten
        run: echo "Deploy nach ${{ secrets.DEPLOY_TOKEN }}"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pip-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "Release" \
            build/app.zip